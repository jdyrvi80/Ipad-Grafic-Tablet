# Progetto XcodeGen (alternativa al .xcodeproj già incluso).
# Rigenera con:  brew install xcodegen && xcodegen generate
name: iPadGraphicTablet
options:
  bundleIdPrefix: com.jodyriva.ipadtablet
  developmentLanguage: it
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # ← inserisci il tuo Team ID (Xcode → Signing & Capabilities)
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TabletMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared/Sources/TabletCore
        group: Shared
      - path: Shared/Sources/TabletLink
        group: Shared
    settings:
      base:
        PRODUCT_NAME: "iPad Graphic Tablet"
        PRODUCT_MODULE_NAME: TabletMac
        PRODUCT_BUNDLE_IDENTIFIER: com.jodyriva.ipadtablet.mac
        INFOPLIST_FILE: Mac/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Mac/Resources/TabletMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - TabletCoreTests

  TabletPad:
    type: application
    platform: iOS
    sources:
      - path: iPad
      - path: Shared/Sources/TabletCore
        group: Shared
      - path: Shared/Sources/TabletLink
        group: Shared
    settings:
      base:
        PRODUCT_NAME: "Graphic Tablet"
        PRODUCT_MODULE_NAME: TabletPad
        PRODUCT_BUNDLE_IDENTIFIER: com.jodyriva.ipadtablet.pad
        INFOPLIST_FILE: iPad/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme: {}

  # Nessuno schema proprio: i test si eseguono dallo schema TabletMac con ⌘U.
  TabletCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared/Tests/TabletCoreTests
      - path: Shared/Sources/TabletCore
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jodyriva.ipadtablet.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
